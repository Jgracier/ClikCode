packages:
  - packages/*

# esbuild ships a platform binary via a postinstall script; without this the
# bundle step fails with "You installed esbuild for another platform".
onlyBuiltDependencies:
  - esbuild
allowBuilds:
  esbuild: true
# The VS Code extension's packaging tools: vsce-sign fetches a signing binary
# and keytar builds a keychain addon, and neither is used to build a .vsix
# (publishing reads its token from the environment).
ignoredBuiltDependencies:
  - '@vscode/vsce-sign'
  - keytar
