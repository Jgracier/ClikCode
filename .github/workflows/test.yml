# Tests only. Publishing is done by ClikDeploy, not by this workflow: it builds this repository,
# computes the patch version, and publishes `clikcode` to npm (plus the GitHub release and the
# VS Code extension). A second publisher here would race it for version numbers, so there is
# deliberately no publish job. See packages/vscode/PUBLISHING.md.
name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm test:all
      - run: pnpm build:strict
      - run: pnpm test:pack
      - run: pnpm --dir packages/vscode type-check
      - run: pnpm --dir packages/vscode test
      - run: pnpm --dir packages/vscode run package
